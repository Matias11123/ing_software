<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ACHS Contingencia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-4 min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-success">Registro de Usuario</h3>
                            <p class="text-muted">Crea una cuenta para la plataforma</p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger py-2 small" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_username" class="form-label fw-semibold">Nombre de usuario</label>
                                <input type="text" class="form-control" id="id_username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="id_email" class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control" id="id_email" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control" id="id_password" name="password" required>
                                <div class="form-text small">
                                    Mínimo 8 caracteres, incluyendo mayúscula, minúscula, número y símbolo.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="id_confirm_password" class="form-label fw-semibold">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="id_confirm_password" name="confirm_password" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 mt-2 fw-bold">Registrarse</button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="text-muted small">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
